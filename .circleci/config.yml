version: 2.1

jobs:
  your-debug-job: # The name of your job
    docker:
      - image: cimg/base:stable # Use any Linux image you need
    steps:
      - checkout
      # ... your other build or test steps ...

      # 👇 Add this step for remote debugging
      - run:
          name: Start sshx for remote debugging
          command: |
            curl -sSf https://sshx.io/get | sh && sshx
